<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: linear-gradient(145deg, #1a1a1a, #111);
            border: 1px solid #f5a020;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 25px rgba(245, 160, 32, 0.15);
        }
        h1 {
            color: #f5a020;
            margin-bottom: 10px;
        }
        p {
            color: #ccc;
            margin: 8px 0;
        }
        .logout-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background-color: #f5a020;
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background-color: #ffb84d;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome, {{ fullname }}! 🎉</h1>
        <p>You are successfully logged in.</p>
        <p><strong>Email:</strong> {{ email }}</p>
        
        <a href="/logout" class="logout-btn">Logout</a>
    </div>
</body>
</html>
